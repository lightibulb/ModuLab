name: ModuLab Benchmark

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout

      - name: Sanity — imports and CLI
        run: |
          python -c "import numpy, scipy, matplotlib, yaml; print('imports ok')"
          python -m modulab.cli representations
          python -m modulab.cli operators

      - name: Unit tests
        run: pytest -q tests/ --timeout=300

      - name: Generate synthetic audio
        run: python scripts/gen_synthetic.py

      - name: Narrowband sweep
        run: python -m modulab.cli sweep --config modulab_config_lite.yaml

      - name: Full lite benchmark
        run: python -m modulab.cli bench --config modulab_config_lite.yaml

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modulab-results
          path: |
            RESULTS.md
            results/
            data/synthetic/
          retention-days: 30
          if-no-files-found: warn
