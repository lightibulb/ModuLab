seed: 42
audio:
  fs: 16000
  duration_s: 3.0

representations:
  stft:
    n_fft: 512
    hop_length: 128
    window: hann
  filterbank_amfm:
    num_bands: 24
    spacing: erb
    f_min_hz: 100
    f_max_hz: 7000
    filter_order: 4
  parallel:
    branches: [filterbank_amfm, stft]
    fusion: average
    weights: [0.5, 0.5]
    crossover_hz: 1500.0
    low_from: 0
    high_from: 1

quantization:
  bit_widths: [4, 6, 8, 12, 16]

metrics:
  quality: [snr_db, si_sdr_db, mcd_db]

narrowband_sweep:
  fc_hz: [500, 1000, 2000, 4000]
  bw_ratios: [0.05, 0.10, 0.20, 0.30, 0.50, 1.00]
  modulation:
    am_freq_hz: 5.0
    am_depth: 0.5
    fm_freq_hz: 10.0
    fm_depth_hz: 20.0
